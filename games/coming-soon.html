    <!-- Logic to fetch upcoming games and handle WhatsApp redirect -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Fetch Upcoming Games Manifest
            fetch('upcoming.json')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('upcoming-list');
                    list.innerHTML = data.map(game => `
                        <li class="flex items-center gap-3">
                            <span class="w-4 h-4 ${game.color} border-2 border-black inline-block"></span>
                            <strong>${game.title}</strong> (${game.status})
                        </li>
                    `).join('');
                })
                .catch(err => {
                    document.getElementById('upcoming-list').innerHTML = `<li><span class="text-red-500">Error loading intel.</span></li>`;
                    console.error('Error fetching upcoming games:', err);
                });

            // Handle WhatsApp Submission
            document.getElementById('idea-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('dev-name').value;
                const gameName = document.getElementById('game-name').value;
                const idea = document.getElementById('game-idea').value;
                
                const message = `My name is ${name} and I have this idea that : (${gameName} - ${idea})`;
                const encodedMessage = encodeURIComponent(message);
                const whatsappUrl = `https://wa.me/923001311047?text=${encodedMessage}`;
                
                // Redirect user to WhatsApp
                window.location.href = whatsappUrl;
            });
        });
    </script>
