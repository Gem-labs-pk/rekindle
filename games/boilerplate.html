<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Title | Rekindle</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Retro Vibe -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #111827; /* Gray 900 for a darker arcade feel */
        }

        .font-pixel {
            font-family: 'Press Start 2P', cursive;
        }

        .retro-box {
            box-shadow: 4px 4px 0px 0px rgba(255,255,255,0.2);
            transition: all 0.1s ease;
        }

        .retro-btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
        }

        .retro-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,1);
        }

        /* Ensure canvas remains sharp when scaled */
        canvas {
            image-rendering: pixelated; 
        }
    </style>
</head>
<body class="min-h-screen text-gray-100 flex flex-col">

    <!-- Top Navigation -->
    <nav class="w-full p-4 flex items-center justify-between bg-gray-800 border-b-4 border-gray-950">
        <a href="../index.html" class="inline-block bg-yellow-400 text-black border-4 border-black font-pixel text-xs py-2 px-4 retro-btn">
            &lt; BACK TO HUB
        </a>
        <h1 class="font-pixel text-xl text-green-400 uppercase tracking-widest hidden sm:block">
            GAME TITLE HERE
        </h1>
        <div class="w-24 hidden sm:block"><!-- Spacer for flex balance --></div>
    </nav>

    <!-- Game Area Container -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-gray-800 p-4 rounded border-4 border-gray-600 retro-box flex flex-col items-center w-full max-w-3xl">
            
            <!-- Game Canvas -->
            <canvas id="gameCanvas" width="600" height="400" class="w-full max-w-[600px] h-auto bg-black border-4 border-black rounded shadow-lg mb-6"></canvas>
            
            <!-- Game Controls -->
            <div class="flex gap-4 w-full justify-center">
                <button id="startBtn" class="bg-green-500 text-black border-4 border-black font-pixel text-sm py-3 px-8 retro-btn">START</button>
                <button id="resetBtn" class="bg-red-500 text-black border-4 border-black font-pixel text-sm py-3 px-8 retro-btn">RESET</button>
            </div>
            
            <!-- Instructions/Status Display -->
            <div id="statusText" class="mt-6 font-pixel text-sm text-yellow-300 text-center uppercase">
                PRESS START TO BEGIN
            </div>

        </div>
    </main>

    <!-- Game Logic Boilerplate -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('statusText');

        let isRunning = false;
        let animationFrameId;

        // Initialize Game State
        function init() {
            // Draw placeholder start screen
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#4ade80'; // Tailwind green-400
            ctx.font = '24px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('READY PLAYER 1', canvas.width / 2, canvas.height / 2);
        }

        // Main Update Logic (Physics, Input, Rules)
        function update() {
            if (!isRunning) return;
            // TODO: Add game logic here
        }

        // Render Graphics to Canvas
        function draw() {
            if (!isRunning) return;
            
            // Clear canvas for next frame
            ctx.fillStyle = '#1f2937'; // Tailwind gray-800
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // TODO: Draw game entities here
            
            // Example animated element
            const time = Date.now() / 1000;
            const x = canvas.width / 2 + Math.cos(time) * 100;
            const y = canvas.height / 2 + Math.sin(time) * 100;
            
            ctx.fillStyle = '#fbbf24'; // Tailwind amber-400
            ctx.fillRect(x - 10, y - 10, 20, 20);
        }

        // Game Loop
        function gameLoop() {
            update();
            draw();
            if (isRunning) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        // Event Listeners
        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                statusText.innerText = "PLAYING...";
                gameLoop();
            }
        });

        resetBtn.addEventListener('click', () => {
            isRunning = false;
            cancelAnimationFrame(animationFrameId);
            statusText.innerText = "GAME RESET. PRESS START.";
            init();
        });

        // Run setup on load
        window.onload = init;
    </script>
</body>
</html>
