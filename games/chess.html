<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Chess | Rekindle</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Retro Vibe -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <!-- Chess.js library for game logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #111827; /* Gray 900 */
        }

        .font-pixel {
            font-family: 'Press Start 2P', cursive;
        }

        .retro-box {
            box-shadow: 4px 4px 0px 0px rgba(255,255,255,0.2);z
        }

        .retro-btn {
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
            transition: all 0.1s ease;
        }

        .retro-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,1);
        }

        /* Chess Board Styles */
        .chess-square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            width: 100%;
            height: 100%;
        }

        @media (min-width: 640px) {
            .chess-square { font-size: 3rem; }
        }

        .light-square { background-color: #fde047; /* yellow-300 */ }
        .dark-square { background-color: #166534; /* green-800 */ }
        .selected-square { background-color: #f97316 !important; /* orange-500 */ }
        
        .piece-white {
            color: #ffffff;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        
        .piece-black {
            color: #000000;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
        }
    </style>
</head>
<body class="min-h-screen text-gray-100 flex flex-col items-center">

    <!-- Top Navigation -->
    <nav class="w-full p-4 flex items-center justify-between bg-gray-800 border-b-4 border-gray-950 max-w-4xl gap-2">
        <a href="../index.html" class="inline-block bg-yellow-400 text-black border-4 border-black font-pixel text-[10px] sm:text-xs py-2 px-3 retro-btn whitespace-nowrap">
            &lt; HUB
        </a>
        <h1 class="font-pixel text-sm sm:text-xl text-white uppercase tracking-widest text-center flex-grow hidden sm:block">
            RETRO CHESS
        </h1>
        <div class="flex gap-2">
            <button id="modeBtn" class="bg-blue-500 text-white border-4 border-black font-pixel text-[10px] sm:text-xs py-2 px-3 retro-btn whitespace-nowrap">
                VS CPU
            </button>
            <button id="resetBtn" class="bg-red-500 text-white border-4 border-black font-pixel text-[10px] sm:text-xs py-2 px-3 retro-btn whitespace-nowrap">
                RESET
            </button>
        </div>
    </nav>

    <!-- Game Area Container -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 w-full max-w-lg">
        
        <!-- Status Display -->
        <div class="bg-blue-600 border-4 border-black text-white font-pixel p-3 mb-6 w-full text-center text-xs sm:text-sm retro-box uppercase" id="statusText">
            LOADING CHESS ENGINE...
        </div>
        
        <!-- Chess Board -->
        <div id="board" class="w-full aspect-square grid grid-cols-8 grid-rows-8 border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] bg-black mb-6">
            <!-- Squares injected via JS -->
        </div>

    </main>

    <!-- Game Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const boardEl = document.getElementById('board');
            const statusText = document.getElementById('statusText');
            const resetBtn = document.getElementById('resetBtn');
            const modeBtn = document.getElementById('modeBtn');

            // Prevent crash if internet/cdn blocks chess.js
            if (typeof Chess === 'undefined') {
                statusText.innerText = "ERROR: CHESS ENGINE OFFLINE";
                statusText.classList.replace("bg-blue-600", "bg-red-600");
                return;
            }

            // Initialize chess.js game engine
            let game = new Chess();
            let selectedSquare = null;
            let vsComputer = true; // Solo Mode by default

            // Unicode pieces mapped to chess.js standard notations
            const pieceSymbols = {
                'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚'
            };

            function renderBoard() {
                boardEl.innerHTML = '';
                const columns = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

                // Render rows 8 down to 1
                for (let r = 8; r >= 1; r--) {
                    for (let c = 0; c < 8; c++) {
                        const squareName = columns[c] + r;
                        
                        const squareEl = document.createElement('div');
                        squareEl.classList.add('chess-square');
                        
                        // Checkered pattern logic: a8 is light, b8 is dark...
                        if ((r + c) % 2 === 0) {
                            squareEl.classList.add('light-square');
                        } else {
                            squareEl.classList.add('dark-square');
                        }

                        // Highlight selected square
                        if (selectedSquare === squareName) {
                            squareEl.classList.add('selected-square');
                        }

                        // Robust piece fetching compatible with old chess.js versions
                        const piece = game.get(squareName);
                        if (piece) {
                            squareEl.innerText = pieceSymbols[piece.type];
                            squareEl.classList.add(piece.color === 'w' ? 'piece-white' : 'piece-black');
                        }

                        // Click Handler
                        squareEl.addEventListener('click', () => handleSquareClick(squareName));
                        
                        boardEl.appendChild(squareEl);
                    }
                }
                updateStatus();
            }

            function handleSquareClick(square) {
                if (game.game_over()) return;
                
                // Block input if it's the CPU's turn
                if (vsComputer && game.turn() === 'b') return;

                // If a square is already selected, try to move
                if (selectedSquare) {
                    let move = game.move({
                        from: selectedSquare,
                        to: square,
                        promotion: 'q' // Auto-promote to Queen
                    });

                    if (move === null) {
                        // Invalid move: Did we click our own piece? Change selection.
                        const piece = game.get(square);
                        if (piece && piece.color === game.turn()) {
                            selectedSquare = square; 
                        } else {
                            selectedSquare = null; 
                        }
                    } else {
                        // Valid player move executed
                        selectedSquare = null;
                        
                        if (vsComputer && !game.game_over()) {
                            renderBoard();
                            statusText.innerText = "CPU IS THINKING...";
                            setTimeout(makeComputerMove, 600); // CPU delay
                            return;
                        }
                    }
                } else {
                    // Select initial piece
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                    }
                }
                renderBoard();
            }

            function makeComputerMove() {
                if (game.game_over()) return;
                
                const possibleMoves = game.moves();
                if (possibleMoves.length === 0) return;

                const randomIdx = Math.floor(Math.random() * possibleMoves.length);
                game.move(possibleMoves[randomIdx]);
                renderBoard();
            }

            function updateStatus() {
                let status = '';
                let moveColor = game.turn() === 'w' ? 'WHITE' : 'BLACK';

                if (game.in_checkmate()) {
                    status = `GAME OVER, ${moveColor} IS IN CHECKMATE.`;
                } else if (game.in_draw()) {
                    status = 'GAME OVER, DRAWN POSITION.';
                } else {
                    status = `${moveColor} TO MOVE`;
                    if (game.in_check()) {
                        status += ', ' + moveColor + ' IS IN CHECK';
                    }
                }
                statusText.innerText = status;
                
                // Color formatting
                if(game.game_over()) {
                    statusText.className = "bg-red-600 border-4 border-black text-white font-pixel p-3 mb-6 w-full text-center text-xs sm:text-sm retro-box uppercase";
                } else if (game.turn() === 'w') {
                    statusText.className = "bg-blue-600 border-4 border-black text-white font-pixel p-3 mb-6 w-full text-center text-xs sm:text-sm retro-box uppercase";
                } else {
                    statusText.className = "bg-purple-600 border-4 border-black text-white font-pixel p-3 mb-6 w-full text-center text-xs sm:text-sm retro-box uppercase";
                }
            }

            // Button Event Listeners
            resetBtn.addEventListener('click', () => {
                game.reset();
                selectedSquare = null;
                renderBoard();
            });

            modeBtn.addEventListener('click', () => {
                vsComputer = !vsComputer;
                modeBtn.innerText = vsComputer ? "VS CPU" : "VS P2";
                game.reset(); // Restart game on mode change
                selectedSquare = null;
                renderBoard();
            });

            // Initial Render
            renderBoard();
        });
    </script>
</body>
</html>
